<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Power BI Data Analysis Diploma — Learning Repository</title>
  <desc id="desc">A seven-phase Power BI learning path covering data foundations, acquisition, advanced extraction, governance, transformation, case studies, and Power Query M Language.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#efe5dc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49332d"/>
      <stop offset="1" stop-color="#2d1e1b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#743348"/>
      <stop offset="1" stop-color="#a05d6e"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d9c9bd" stroke-width="1" opacity=".35"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#342724" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".32"/>
  <path d="M0 0H1200V12H0Z" fill="#743348"/>
  <circle cx="580" cy="40" r="220" fill="#c4a084" opacity=".08"/>
  <circle cx="65" cy="585" r="190" fill="#743348" opacity=".045"/>

  <g font-family="Inter, Aptos, Segoe UI, Arial, sans-serif">
    <rect x="68" y="66" width="310" height="38" rx="19" fill="#f1e6dd" stroke="#dfd0c4"/>
    <circle cx="91" cy="85" r="5" fill="#743348"/>
    <text x="108" y="91" font-size="13" font-weight="700" letter-spacing="1.6" fill="#743348">SELF-DIRECTED LEARNING</text>

    <text x="68" y="177" font-size="56" font-weight="800" letter-spacing="-2.2" fill="#342724">POWER BI</text>
    <text x="68" y="244" font-size="56" font-weight="800" letter-spacing="-2.2" fill="#342724">DATA ANALYSIS</text>
    <text x="68" y="311" font-size="56" font-weight="800" letter-spacing="-2.2" fill="#743348">DIPLOMA</text>

    <text x="72" y="354" font-size="20" font-weight="500" fill="#74635b">A structured learning &amp; practice repository</text>

    <g transform="translate(68 401)">
      <rect width="145" height="78" rx="14" fill="#fffdfa" stroke="#dfd0c4"/>
      <text x="18" y="37" font-size="29" font-weight="800" fill="#743348">81</text>
      <text x="18" y="59" font-size="11" font-weight="700" letter-spacing="1.1" fill="#74635b">LECTURES</text>
      <rect x="159" width="145" height="78" rx="14" fill="#fffdfa" stroke="#dfd0c4"/>
      <text x="177" y="37" font-size="29" font-weight="800" fill="#743348">07</text>
      <text x="177" y="59" font-size="11" font-weight="700" letter-spacing="1.1" fill="#74635b">LEARNING PHASES</text>
      <rect x="318" width="145" height="78" rx="14" fill="#fffdfa" stroke="#dfd0c4"/>
      <text x="336" y="37" font-size="29" font-weight="800" fill="#743348">17</text>
      <text x="336" y="59" font-size="11" font-weight="700" letter-spacing="1.1" fill="#74635b">CASE STUDIES</text>
    </g>

    <text x="72" y="530" font-size="13" font-weight="700" letter-spacing="1.2" fill="#74635b">POWER QUERY  ·  M LANGUAGE  ·  DATA TRANSFORMATION</text>
    <text x="72" y="565" font-size="12" font-weight="500" fill="#9b887d">Course by Eng. Essam Elsayed (MCT) · Documentation, datasets &amp; practice</text>
  </g>

  <g transform="translate(665 46)" filter="url(#shadow)">
    <rect width="475" height="538" rx="24" fill="url(#panel)"/>
    <rect x="18" y="18" width="439" height="502" rx="17" fill="none" stroke="#8b6e62" opacity=".52"/>
    <text x="40" y="57" font-family="Inter, Aptos, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#c4a084">THE LEARNING PATH</text>
    <text x="40" y="91" font-family="Inter, Aptos, Segoe UI, Arial, sans-serif" font-size="25" font-weight="750" fill="#fffdfa">From raw data to insight</text>

    <path d="M58 134V433" stroke="#87675c" stroke-width="2" stroke-dasharray="4 7"/>
    <g font-family="Inter, Aptos, Segoe UI, Arial, sans-serif">
      <g transform="translate(40 118)">
        <circle cx="18" cy="18" r="17" fill="#743348" stroke="#dcaeb9" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">01</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Data foundations</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">Tidy data &amp; BI lifecycle</text>
      </g>
      <g transform="translate(40 167)">
        <circle cx="18" cy="18" r="17" fill="#825063" stroke="#dcaeb9" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">02</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Data acquisition</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">Files, cloud &amp; SQL sources</text>
      </g>
      <g transform="translate(40 216)">
        <circle cx="18" cy="18" r="17" fill="#956f75" stroke="#e3c9c7" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">03</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Advanced extraction</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">Web, APIs &amp; JSON</text>
      </g>
      <g transform="translate(40 265)">
        <circle cx="18" cy="18" r="17" fill="#a47c69" stroke="#e8d3bf" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#fffdfa">04</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Governance &amp; automation</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">Privacy, parameters &amp; dataflows</text>
      </g>
      <g transform="translate(40 314)">
        <circle cx="18" cy="18" r="17" fill="#b38e76" stroke="#e8d3bf" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#342724">05</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Data transformation</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">Clean, shape, merge &amp; append</text>
      </g>
      <g transform="translate(40 363)">
        <circle cx="18" cy="18" r="17" fill="#c4a084" stroke="#f0dfcd" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#342724">06</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Practical case studies</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">17 guided business scenarios</text>
      </g>
      <g transform="translate(40 412)">
        <circle cx="18" cy="18" r="17" fill="#dfc8b6" stroke="#fff0df" stroke-width="1.5"/>
        <text x="18" y="23" text-anchor="middle" font-size="12" font-weight="800" fill="#342724">07</text>
        <text x="50" y="15" font-size="14" font-weight="700" fill="#fffdfa">Power Query engine &amp; M</text>
        <text x="50" y="33" font-size="10.5" fill="#c9b5a8">Functions, errors &amp; optimization</text>
      </g>
    </g>

    <rect x="306" y="442" width="122" height="54" rx="9" fill="#241916" stroke="#6b5046"/>
    <text x="320" y="461" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#c4a084">let</text>
    <text x="320" y="477" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#fffdfa">  Source = ...</text>
    <text x="320" y="491" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" fill="#c4a084">in  Result</text>
  </g>
</svg>