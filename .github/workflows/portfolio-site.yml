name: Validate portable portfolio
on:
  push:
    branches: [main]
    paths: ['portfolio-site/**', '.github/workflows/portfolio-site.yml']
  pull_request:
    paths: ['portfolio-site/**', '.github/workflows/portfolio-site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: portable-portfolio
          path: portfolio-site/dist
