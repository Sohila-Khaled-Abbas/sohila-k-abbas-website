name: Portfolio site validation and preview UX
on:
  push:
    branches: [main, 'redesign/**']
    paths: ['portfolio-site/**', '.github/workflows/portfolio-site.yml', 'screenshots/**']
  pull_request:
    paths: ['portfolio-site/**', '.github/workflows/portfolio-site.yml', 'screenshots/**']
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json
      - name: Install portfolio dependencies
        run: npm ci --ignore-scripts
      - name: Unit and regression tests
        run: node --test tests/*.test.mjs
      - name: Build static portfolio
        run: npm run build
      - name: Validate generated routes, content and links
        run: npm run check
      - name: Install pinned visual test tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.65.1 @lhci/cli@0.16.1
      - name: Install Chromium for Playwright and Lighthouse
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from 'playwright'; console.log('CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Resolve the successful Vercel preview URL
        id: preview
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha ?? context.sha;
            const {owner,repo} = context.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve,ms));
            for (let attempt=1; attempt<=36; attempt++) {
              const {data:deployments} = await github.rest.repos.listDeployments({owner,repo,sha,per_page:30});
              for (const deployment of deployments) {
                const environment = String(deployment.environment || '').toLowerCase();
                if (environment && !environment.includes('preview')) continue;
                const {data:statuses} = await github.rest.repos.listDeploymentStatuses({owner,repo, deployment_id:deployment.id, per_page:10});
                const ready = statuses.find(status => status.state === 'success' && status.environment_url);
                if (!ready) continue;
                const url = new URL(ready.environment_url);
                if (url.protocol === 'https:' && url.hostname.endsWith('.vercel.app') && url.hostname !== 'sohila-khaled-abbas.vercel.app') {
                  core.setOutput('url',url.origin);
                  core.info('Testing successful Vercel preview: ' + url.origin);
                  return;
                }
              }
              core.info('Waiting for Vercel preview deployment status (' + attempt + '/36).');
              await sleep(10000);
            }
            throw new Error('No successful Vercel Preview deployment was found for commit ' + sha + '.');
      - name: Responsive Playwright checks and full-page screenshots
        if: steps.preview.outputs.url != ''
        run: node tests/visual-preview.mjs
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
      - name: Lighthouse CI — mobile performance, accessibility and SEO
        if: steps.preview.outputs.url != ''
        run: npx lhci autorun --config=./lighthouserc.cjs
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
      - name: Upload screenshots and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-qa
          path: |
            screenshots/
            portfolio-site/lighthouse-reports/
          if-no-files-found: warn
