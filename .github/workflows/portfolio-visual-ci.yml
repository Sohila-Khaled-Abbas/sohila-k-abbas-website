name: Portfolio visual and performance checks

on:
  push:
    branches:
      - redesign/hero-palette-editorial-ui
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional Vercel preview URL (otherwise resolved from this commit)
        required: false
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  visual-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.head_commit.id || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install site dependencies
        working-directory: portfolio-site
        run: npm ci

      - name: Run existing unit tests
        working-directory: portfolio-site
        run: npm test

      - name: Build and run static checks
        working-directory: portfolio-site
        run: |
          npm run build
          npm run check

      - name: Resolve the Vercel preview URL for this commit
        id: resolve-preview
        if: ${{ !inputs.base_url }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_SHA: ${{ github.event.head_commit.id || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFile} from 'node:fs/promises';
          const {GITHUB_TOKEN,REPOSITORY,DEPLOYMENT_SHA,GITHUB_OUTPUT}=process.env;
          const headers={Authorization:`Bearer ${GITHUB_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const api=`https://api.github.com/repos/${REPOSITORY}`;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          for(let attempt=1;attempt<=36;attempt++){
            const response=await fetch(`${api}/deployments?sha=${DEPLOYMENT_SHA}&per_page=100`,{headers});
            if(!response.ok)throw new Error(`GitHub deployment lookup failed: ${response.status} ${await response.text()}`);
            const deployments=await response.json();
            const matching=deployments.filter(item=>item.sha===DEPLOYMENT_SHA).sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
            for(const deployment of matching){
              const statusResponse=await fetch(`${api}/deployments/${deployment.id}/statuses?per_page=20`,{headers});
              if(!statusResponse.ok)continue;
              const statuses=await statusResponse.json();
              for(const status of statuses){
                if(status.state!=='success'||!status.environment_url)continue;
                let url;
                try{url=new URL(status.environment_url);}catch{continue;}
                if(url.protocol!=='https:'||!url.hostname.endsWith('.vercel.app'))continue;
                await appendFile(GITHUB_OUTPUT,`url=${url.origin}
`);
                console.log(`Resolved Vercel preview for ${DEPLOYMENT_SHA}: ${url.origin}`);
                process.exit(0);
              }
            }
            console.log(`Waiting for Vercel preview deployment for ${DEPLOYMENT_SHA} (${attempt}/36)`);
            await sleep(10000);
          }
          throw new Error('No successful Vercel preview status with a vercel.app environment_url was found for this commit.');
          NODE

      - name: Wait for the Vercel preview
        env:
          BASE_URL: ${{ inputs.base_url || steps.resolve-preview.outputs.url }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'const u=new URL(process.env.BASE_URL); if(u.protocol!=="https:" || !u.hostname.endsWith(".vercel.app")) throw new Error("BASE_URL must be a Vercel HTTPS preview URL");'
          ready=0
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 "$BASE_URL/" -o /dev/null; then ready=1; break; fi
            echo "Preview is not responding yet (attempt $attempt/24)."
            sleep 10
          done
          test "$ready" -eq 1

      - name: Install browser and Lighthouse test tools
        working-directory: portfolio-site
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.65.1 @lhci/cli@0.16.1
          npx playwright install --with-deps chromium

      - name: Run responsive Playwright checks and capture full-page screenshots
        working-directory: portfolio-site
        run: npx playwright test --config=playwright.config.mjs
        env:
          BASE_URL: ${{ inputs.base_url || steps.resolve-preview.outputs.url }}
          CI: true

      - name: Run mobile Lighthouse CI
        working-directory: portfolio-site
        run: npx lhci autorun --config=.lighthouserc.cjs
        env:
          BASE_URL: ${{ inputs.base_url || steps.resolve-preview.outputs.url }}

      - name: Upload screenshots and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-evidence-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
