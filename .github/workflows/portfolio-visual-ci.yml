name: Portfolio visual and performance checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional URL to test (use only an accessible preview)
        required: false
        type: string

permissions:
  contents: read

jobs:
  visual-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PREVIEW_URL: https://sohila-khaled-abbas-git-red-a1eef7-sohila-khaled-abbas-projects.vercel.app
      BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install site dependencies
        working-directory: portfolio-site
        run: npm ci

      - name: Run existing unit tests
        working-directory: portfolio-site
        run: npm test

      - name: Build and run static checks
        working-directory: portfolio-site
        run: |
          npm run build
          npm run check

      - name: Check whether Vercel preview is publicly accessible and start the exact PR build locally
        working-directory: portfolio-site
        env:
          PREVIEW_URL: ${{ inputs.base_url || env.PREVIEW_URL }}
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          set -euo pipefail
          preview_file="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 20 -o "$preview_file" -w '%{http_code}' "$PREVIEW_URL/" || true)"
          if grep -Eqi 'Log in to Vercel|Deployment Protection|Sign in to Vercel' "$preview_file"; then
            echo "Vercel preview protection detected (HTTP $status). Keeping protection enabled; UI tests will use this workflow's freshly built dist output."
          elif [ "$status" = "200" ] && grep -q 'signature-hero' "$preview_file"; then
            echo "Vercel preview is publicly accessible."
          else
            echo "Preview response did not contain the portfolio hero (HTTP $status). UI tests will use the freshly built dist output."
          fi
          rm -f "$preview_file"
          npm run dev > /tmp/portfolio-visual-preview.log 2>&1 &
          echo $! > /tmp/portfolio-visual-preview.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "$BASE_URL/" -o /tmp/portfolio-local-home.html; then
              if grep -q 'signature-hero' /tmp/portfolio-local-home.html; then ready=1; break; fi
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/portfolio-visual-preview.log; exit 1; fi
          echo "Playwright and Lighthouse will test the built output from commit $GITHUB_SHA at $BASE_URL."

      - name: Install browser and Lighthouse test tools
        working-directory: portfolio-site
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.65.1 @lhci/cli@0.16.1
          npx playwright install --with-deps chromium

      - name: Run responsive Playwright checks and capture full-page screenshots
        working-directory: portfolio-site
        run: npx playwright test --config=playwright.config.mjs
        env:
          CI: true

      - name: Run mobile Lighthouse CI
        working-directory: portfolio-site
        run: npx lhci autorun --config=.lighthouserc.cjs

      - name: Upload screenshots and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-evidence-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
